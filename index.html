<style>
  :root{
    --teal-950:#0c2126;
    --teal-900:#12313a;
    --teal-800:#1a3a45;
    --teal-700:#234b58;
    --gold-300:#ecd39c;
    --gold-500:#d4af5a;
    --gold-700:#a4792f;
    --ivory:#f6f1e6;
    --mist:#aebdc0;

    /* Largeur de la carte : la plus petite des trois contraintes.
       Portrait : limitee par la largeur d'ecran. Paysage : par la hauteur.
       La reserve de 124px garde de l'air au-dessus et sous la carte,
       et laisse la place a l'indication de geste. */
    --cw: min(92vw, 560px, (100svh - 124px) * 1.5);

    --flip-duration:0.62s;
    --flip-ease:cubic-bezier(.5,.12,.15,1);
    --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  @supports not (height: 100svh){
    :root{ --cw: min(92vw, 560px, (100vh - 124px) * 1.5); }
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  /* Fond en deux temps, sans aucune arete possible :
     1. <html> porte la couleur de base unie -> couvre 100% de l'ecran en
        toutes circonstances (barres de Safari, encoche, indicateur d'accueil).
     2. Un halo pose par-dessus s'eteint en TRANSPARENCE, jamais sur une autre
        couleur : il rejoint donc la base progressivement, ou qu'il s'arrete. */
  html{
    height:100%;
    background-color:var(--teal-950);
  }

  /* Body verrouille sur le viewport : aucune barre blanche, aucun rebond. */
  body{
    position:fixed;
    inset:0;
    overflow:hidden;
    overscroll-behavior:none;
    background:transparent;
    color:var(--ivory);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    padding:
      max(16px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  /* Halo : deborde volontairement l'ecran et se termine en alpha 0 sur la
     meme teinte -> raccord invisible quelle que soit la taille reelle. */
  body::before{
    content:"";
    position:fixed;
    inset:-25%;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(closest-side ellipse at 50% 42%,
      rgba(38,84,98,.95) 0%,
      rgba(32,70,82,.62) 38%,
      rgba(26,56,66,.28) 66%,
      rgba(23,50,59,0) 100%);
  }

  img{
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;   /* les glissements atteignent toujours la carte */
  }

  /* La carte est seule dans le flux : elle est donc centree verticalement
     sur l'ecran. L'indication de geste est detachee, en bas. */
  .stage{
    position:absolute;
    inset:0;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card-frame{
    width:var(--cw);
    aspect-ratio:3 / 2;
    perspective:1800px;
    touch-action:none;
    cursor:grab;
    outline:none;
    filter:drop-shadow(0 calc(var(--cw)*.07) calc(var(--cw)*.11) rgba(2,10,13,.55));
  }
  .card-frame:active{ cursor:grabbing; }
  .card-frame:focus-visible .face{
    box-shadow:0 0 0 3px var(--gold-300), inset 0 0 0 1px rgba(212,175,90,.16);
  }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transform:rotateY(0deg);
    transition:transform var(--flip-duration) var(--flip-ease);
  }
  .card-inner.dragging{ transition:none; }
  .card-inner.is-flipped{ transform:rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    border-radius:calc(var(--cw) * .055);
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--teal-800);
    box-shadow:inset 0 0 0 1px rgba(212,175,90,.16);
  }
  .face--back{ transform:rotateY(180deg); }

  .corner{ position:absolute; width:28%; aspect-ratio:1 / 1; }
  .corner::after{ content:""; position:absolute; inset:0; mix-blend-mode:overlay; }

  .corner--tl{
    top:0; left:0;
    clip-path:polygon(0 0, 100% 0, 0 46%);
    background:linear-gradient(135deg, var(--gold-300) 0%, var(--gold-500) 48%, var(--gold-700) 100%);
  }
  .corner--tl::after{
    background:linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,0) 40%);
  }
  .corner--br{
    bottom:0; right:0;
    clip-path:polygon(100% 100%, 100% 54%, 0 100%);
    background:linear-gradient(315deg, var(--gold-300) 0%, var(--gold-500) 48%, var(--gold-700) 100%);
  }
  .corner--br::after{
    background:linear-gradient(315deg, rgba(255,255,255,.35), rgba(255,255,255,0) 40%);
  }

  .face-content{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:calc(var(--cw) * .019);
    padding:calc(var(--cw) * .045) calc(var(--cw) * .07);
  }

  /* ---------- Recto ---------- */
  .wordmark{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:calc(var(--cw) * .004);
    line-height:1;
  }
  .wordmark span{
    font-family:var(--serif);
    font-weight:800;
    font-size:calc(var(--cw) * .082);
    letter-spacing:.02em;
    color:var(--ivory);
    white-space:nowrap;
  }
  .wordmark img{
    height:calc(var(--cw) * .125);
    width:auto;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
  }

  .tagline{
    font-family:var(--serif);
    font-weight:700;
    font-style:italic;
    font-size:calc(var(--cw) * .032);
    letter-spacing:calc(var(--cw) * .0072);
    color:var(--gold-300);
    text-transform:uppercase;
  }

  .rule{
    width:34%;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-500), transparent);
    margin:calc(var(--cw) * .014) 0;
  }

  .services{
    font-family:var(--sans);
    font-weight:500;
    font-size:calc(var(--cw) * .027);
    letter-spacing:calc(var(--cw) * .0045);
    line-height:1.7;
    color:var(--mist);
    text-transform:uppercase;
  }

  /* ---------- Verso ---------- */
  .headline{
    font-family:var(--sans);
    font-weight:700;
    font-size:calc(var(--cw) * .045);
    letter-spacing:calc(var(--cw) * .009);
    color:var(--gold-300);
    text-transform:uppercase;
    text-shadow:0 2px 6px rgba(6,15,18,.45);
  }

  .qr-card{
    background:#ffffff;
    border-radius:calc(var(--cw) * .042);
    padding:calc(var(--cw) * .028);
    line-height:0;
    box-shadow:0 calc(var(--cw)*.02) calc(var(--cw)*.05) rgba(0,0,0,.35);
  }
  .qr-card img{
    display:block;
    width:calc(var(--cw) * .31);
    height:calc(var(--cw) * .31);
  }

  .scan-caption{
    font-size:calc(var(--cw) * .032);
    font-weight:500;
    color:var(--ivory);
  }

  .stars{
    color:var(--gold-500);
    font-size:calc(var(--cw) * .04);
    letter-spacing:calc(var(--cw) * .009);
    line-height:1;
    text-shadow:0 2px 6px rgba(0,0,0,.3);
  }

  /* ---------- Indice de geste (detache du flux) ---------- */
  .hint{
    position:absolute;
    left:0;
    right:0;
    bottom:max(20px, calc(env(safe-area-inset-bottom) + 12px));
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:clamp(11px, calc(var(--cw) * .033), 14px);
    color:var(--mist);
    opacity:.85;
    transition:opacity .5s ease;
    text-align:center;
  }
  .hint.faded{ opacity:.3; }
  .hint .arrows{
    display:inline-block;
    font-size:1.2em;
    animation:nudge 1.9s ease-in-out infinite;
  }
  @keyframes nudge{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(-5px); }
  }

  /* Telephone tenu a l'horizontale : mode presentation. L'indication
     disparait et la carte occupe le maximum de hauteur disponible,
     pour un QR code aussi grand que possible face au client. */
  @media (orientation: landscape) and (max-height: 460px){
    :root{ --cw: min(94vw, 620px, (100svh - 56px) * 1.5); }
    .hint{ display:none; }
  }
  @supports not (height: 100svh){
    @media (orientation: landscape) and (max-height: 460px){
      :root{ --cw: min(94vw, 620px, (100vh - 56px) * 1.5); }
    }
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition-duration:.001s; }
    .hint .arrows{ animation:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card-frame" id="cardFrame" tabindex="0" role="button"
       aria-label="Carte AMG Technik, recto affich&eacute;. Glissez ou appuyez sur Entr&eacute;e pour la retourner.">
    <div class="card-inner" id="cardInner">

      <div class="face face--front">
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>
        <div class="face-content">

<script>
(function(){
  var frame = document.getElementById('cardFrame');
  var inner = document.getElementById('cardInner');
  var hint  = document.getElementById('hint');
  var hintText = document.getElementById('hintText');

  var flipped = false;
  var dragging = false;
  var startX = 0, startY = 0, dx = 0;
  var axis = null;
  var factor = 1;
  var interacted = false;

  var LABEL_FRONT = 'Carte AMG Technik, recto affich\u00e9. Glissez ou appuyez sur Entr\u00e9e pour la retourner.';
  var LABEL_BACK  = 'Carte AMG Technik, verso affich\u00e9 avec le QR code d\u2019avis Google. Glissez ou appuyez sur Entr\u00e9e pour revenir.';
  var HINT_FRONT  = 'Glissez pour d\u00e9couvrir l\u2019avis Google';
  var HINT_BACK   = 'Glissez pour revenir \u00e0 la carte';

  function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

  function setFlipped(next){
    flipped = next;
    inner.classList.toggle('is-flipped', flipped);
    frame.setAttribute('aria-label', flipped ? LABEL_BACK : LABEL_FRONT);
    hintText.textContent = flipped ? HINT_BACK : HINT_FRONT;
    if(!interacted){ interacted = true; hint.classList.add('faded'); }
  }

  function begin(x, y){
    dragging = true;
    axis = null;
    startX = x; startY = y; dx = 0;
    factor = 220 / frame.getBoundingClientRect().width;
    inner.classList.add('dragging');
  }

  function move(x, y){
    if(!dragging) return;
    var mx = x - startX, my = y - startY;
    if(axis === null && (Math.abs(mx) > 6 || Math.abs(my) > 6)){
      axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    }
    if(axis !== 'x') return;
    dx = mx;
    var angle = clamp((flipped ? 180 : 0) - dx * factor, 0, 180);
    inner.style.transform = 'rotateY(' + angle + 'deg)';
  }

  function end(){
    if(!dragging) return;
    dragging = false;
    inner.classList.remove('dragging');
    inner.style.transform = '';
    if(axis !== 'x'){
      if(Math.abs(dx) < 6){ setFlipped(!flipped); }   /* simple appui */
      axis = null;
      return;
    }
    var angle = clamp((flipped ? 180 : 0) - dx * factor, 0, 180);
    if(Math.abs(dx) < 6){ setFlipped(!flipped); }
    else { setFlipped(angle > 90); }
    axis = null;
  }

  if(window.PointerEvent){
    frame.addEventListener('pointerdown', function(e){
      frame.setPointerCapture && frame.setPointerCapture(e.pointerId);
      begin(e.clientX, e.clientY);
    });
    frame.addEventListener('pointermove', function(e){ move(e.clientX, e.clientY); });
    frame.addEventListener('pointerup', end);
    frame.addEventListener('pointercancel', end);
  } else {
    frame.addEventListener('touchstart', function(e){
      var t = e.changedTouches[0]; begin(t.clientX, t.clientY);
    }, {passive:true});
    frame.addEventListener('touchmove', function(e){
      var t = e.changedTouches[0]; move(t.clientX, t.clientY);
      if(axis === 'x') e.preventDefault();
    }, {passive:false});
    frame.addEventListener('touchend', end);
    frame.addEventListener('touchcancel', end);
    frame.addEventListener('click', function(){ setFlipped(!flipped); });
  }

  frame.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setFlipped(!flipped); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); setFlipped(true); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); setFlipped(false); }
  });

  /* Empeche le zoom par double-appui sur iOS */
  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if(now - lastTouch < 350){ e.preventDefault(); }
    lastTouch = now;
  }, {passive:false});
})();
</script>
